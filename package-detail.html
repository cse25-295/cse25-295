<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Details - Gaone Adventures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <strong>GAONE ADVENTURES</strong>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link mx-3" href="index.html">Home</a>
                    <a class="nav-link mx-3" href="packages.html">Packages</a>
                    <a class="nav-link mx-3" href="planner.html">Trip Planner</a>
                    <a class="nav-link mx-3" href="about.html">About Us</a>
                    <a class="nav-link mx-3" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="page-header bg-dark text-white py-5 mt-5">
        <div class="container">
            <h1 id="package-name" class="display-4 fw-bold">Package Name</h1>
            <p id="package-tagline" class="lead">Tagline goes here</p>
        </div>
    </section>

    <!-- Main Content -->
    <section class="container my-5">
        <div class="row align-items-center g-5">
            <!-- Left: Image -->
            <div class="col-lg-7">
                <img id="package-img" 
                     src="" 
                     class="img-fluid rounded-4 shadow" 
                     alt="Package Image"
                     style="height: 520px; object-fit: cover; width: 100%;">
            </div>

            <!-- Right: Details -->
            <div class="col-lg-5">
                <div class="value-card p-4 border rounded-4 shadow-sm">
                    <h2 class="mb-4">Package Details</h2>
                    
                    <ul class="list-unstyled fs-5" id="details-list">
                        <!-- Populated by JavaScript -->
                    </ul>

                    <h3 id="package-price" class="text-success mt-4 mb-3"></h3>

                    <a href="planner.html" class="btn btn-accent btn-lg w-100 mb-3">
                        Plan This Trip
                    </a>
                    <button onclick="alert('Booking feature coming soon!')" 
                            class="btn btn-outline-dark btn-lg w-100">
                        Enquire Now
                    </button>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Package Data
        const packages = {
            okavango: {
                name: "Okavango Explorer",
                tagline: "Discover the Jewel of Botswana",
                price: "From P18,500 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/Okavango.jpg",
                details: [
                    "Duration: 5 Days / 4 Nights",
                    "Experience Type: Mid-range",
                    "Location: Okavango Delta",
                    "Accommodation: Luxury Tented Camps",
                    "Activities: Game Drives, Mokoro Canoe, Bush Walks",
                    "Best Time: June to October"
                ]
            },
            chobe: {
                name: "Chobe Wildlife Adventure",
                tagline: "Elephants & River Safaris",
                price: "From P12,800 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/Chobe.jpg",
                details: [
                    "Duration: 4 Days / 3 Nights",
                    "Experience Type: Budget",
                    "Location: Chobe National Park",
                    "Accommodation: Lodge & Tent",
                    "Activities: Boat Safaris, Game Drives",
                    "Best Time: May to September"
                ]
            },
            luxury: {
                name: "Luxury Safari Escape",
                tagline: "Premium Botswana Experience",
                price: "From P32,000 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/Luxary.jpg",
                details: [
                    "Duration: 6 Days / 5 Nights",
                    "Experience Type: Luxury",
                    "Location: Okavango + Chobe",
                    "Accommodation: 5-Star Lodges",
                    "Activities: Private Game Drives, Helicopter Flights",
                    "Best Time: All Year (Premium Season)"
                ]
            },
            highlights: {
                name: "Botswana Highlights",
                tagline: "The Best of Botswana",
                price: "From P24,000 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/first.jpg",
                details: [
                    "Duration: 5 Days / 4 Nights",
                    "Experience Type: Mid-range",
                    "Locations: Multiple Parks",
                    "Accommodation: Comfortable Lodges",
                    "Activities: Game Drives & Cultural Visits"
                ]
            },
            family: {
                name: "Family Safari Fun",
                tagline: "Adventure for All Ages",
                price: "From P19,000 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/Midrange.jpg",
                details: [
                    "Duration: 5 Days / 4 Nights",
                    "Experience Type: Mid-range",
                    "Family Friendly Activities",
                    "Kid-Friendly Guides & Camps"
                ]
            },
            romantic: {
                name: "Romantic Getaway",
                tagline: "Intimate Safari for Couples",
                price: "From P28,000 per person",
                img: "https://raw.githubusercontent.com/cse25-295/cse25-295/main/Images/romantic.jpg",
                details: [
                    "Duration: 4 Days / 3 Nights",
                    "Experience Type: Luxury",
                    "Private Romantic Dinners",
                    "Couple Activities & Experiences"
                ]
            }
        };

        // Get package from URL
        const params = new URLSearchParams(window.location.search);
        const packageKey = params.get('package');

        if (packageKey && packages[packageKey]) {
            const pkg = packages[packageKey];

            document.getElementById('package-name').textContent = pkg.name;
            document.getElementById('package-tagline').textContent = pkg.tagline;
            document.getElementById('package-img').src = pkg.img;
            document.getElementById('package-price').textContent = pkg.price;

            // Populate details list
            const ul = document.getElementById('details-list');
            ul.innerHTML = '';
            pkg.details.forEach(item => {
                const li = document.createElement('li');
                li.className = 'mb-3';
                li.innerHTML = `<strong>${item}</strong>`;
                ul.appendChild(li);
            });

            document.title = `${pkg.name} - Gaone Adventures`;
        } else {
            document.getElementById('package-name').textContent = "Package Not Found";
        }
    </script>
</body>
</html>
