<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Botswana Trip - Gaone Adventures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html"><strong>GAONE ADVENTURES</strong></a>
        <div class="navbar-nav ms-auto d-flex align-items-center">
            <a class="nav-link mx-3" href="index.html">Home</a>
            <a class="nav-link mx-3" href="packages.html">Packages</a>
            <a class="nav-link active mx-3" href="planner.html">Trip Planner</a>
            <a class="nav-link mx-3" href="about.html">About Us</a>
            <a class="nav-link mx-3" href="contact.html">Contact</a>
            <a href="planner.html" class="btn btn-warning ms-3">Plan My Trip</a>
        </div>
    </div>
</nav>

<div class="container mt-5 pt-5">
    <h2 class="text-center mb-2">Plan Your Botswana Trip</h2>
    <p class="text-center mb-5">Tell us your preferences and get a custom itinerary in minutes.</p>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow">
                <div class="card-body p-5">

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">Destination</label>
                            <select class="form-select">
                                <option>Okavango Delta</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Travel Dates</label>
                            <input type="text" class="form-control" value="20 Jun 2025 - 27 Jun 2025">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Budget Range</label>
                            <select class="form-select">
                                <option>Mid-range</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Travel Style</label>
                            <select class="form-select">
                                <option>Adventure & Wildlife</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Travellers</label>
                            <select class="form-select">
                                <option>2 Adults</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="generatePlan()" class="btn btn-dark btn-lg w-100 mt-5 py-3">
                        Generate My Trip Plan ✨
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
