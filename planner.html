<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner | Gaone Adventures</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="main-header">

    <div class="logo">
        <h2>GAONE ADVENTURES</h2>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="planner.html" class="active">
            Trip Planner
        </a>

        <a href="packages.html">
            Packages
        </a>

        <a href="about.html">
            About Us
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="planner.html" class="plan-btn">
            Plan My Trip
        </a>

    </nav>

</header>

<section class="planner-section">

    <h1>Plan Your Botswana Adventure</h1>

    <p>
        Build your perfect safari experience in minutes.
    </p>

    <form class="planner-form">

        <select required>
            <option>Okavango Delta</option>
            <option>Chobe National Park</option>
            <option>Moremi Game Reserve</option>
        </select>

        <input type="date" required>

        <select required>
            <option>Luxury</option>
            <option>Mid-range</option>
            <option>Budget</option>
        </select>

        <button type="submit" class="generate-btn">
            Generate Trip
        </button>

    </form>

</section>

<footer>
    <p>© 2026 Gaone Adventures</p>
</footer>

</body>
</html>
