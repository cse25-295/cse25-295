<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner - Gaone Adventures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GAONE ADVENTURES</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="planner.html">Trip Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 mt-5">
        <div class="container">
            <h2 class="text-center mb-4">Plan Your Botswana Trip</h2>
            <p class="text-center lead mb-5">Tell us your preferences and get a custom itinerary in minutes.</p>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Destination</label>
                                    <select class="form-select">
                                        <option selected>Okavango Delta</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Travel Dates</label>
                                    <input type="text" class="form-control" value="20 Jun 2025 - 27 Jun 2025">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Budget Range</label>
                                    <select class="form-select">
                                        <option selected>Mid-range</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Travel Style</label>
                                    <select class="form-select">
                                        <option selected>Adventure & Wildlife</option>
                                    </select>
                                </div>
                            </div>
                            
                            <button onclick="generatePlan()" class="btn btn-dark btn-lg w-100 mt-5">
                                Generate My Trip Plan ✨
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
