<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Gaone Adventures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">GAONE ADVENTURES</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="planner.html">Trip Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 mt-5">
        <div class="container">
            <h2 class="text-center mb-5">Get in Touch</h2>
            <p class="text-center lead mb-5">We're here to help you plan your perfect safari.</p>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="row">
                        <!-- Contact Form -->
                        <div class="col-md-7">
                            <form>
                                <div class="mb-3">
                                    <input type="text" class="form-control" placeholder="Your Name">
                                </div>
                                <div class="mb-3">
                                    <input type="email" class="form-control" placeholder="Email Address">
                                </div>
                                <div class="mb-3">
                                    <textarea class="form-control" rows="5" placeholder="How can we help you?"></textarea>
                                </div>
                                <button type="button" onclick="bookNow()" class="btn btn-dark w-100">
                                    Send Message →
                                </button>
                            </form>
                        </div>

                        <!-- Contact Info -->
                        <div class="col-md-5">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5>Contact Information</h5>
                                    <hr>
                                    <p><i class="fas fa-phone"></i> +267 71 123 456</p>
                                    <p><i class="fas fa-envelope"></i> info@gaoneadventures.com</p>
                                    <p><i class="fas fa-whatsapp"></i> +267 71 123 456</p>
                                    <p><i class="fas fa-map-marker-alt"></i> Maun, Botswana</p>
                                    
                                    <button onclick="bookNow()" class="btn btn-success w-100 mt-4">
                                        <i class="fab fa-whatsapp"></i> Chat on WhatsApp
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
